## O QUE É HTML SEMÂNTICO?
A palavra semântica está relacionada ao significado.
Compare:

#### <div>Notícias</div>

com:
<nav>Notícias</nav>

Os dois podem aparecer visualmente muito parecidos.
Mas existe uma diferença importante:

<div>
"Sou apenas uma divisão."
</div>

Enquanto:

<nav>
"Aqui existe uma área de navegação."

</nav>
